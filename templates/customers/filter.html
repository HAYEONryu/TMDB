<dialog id="filter-dialog" class="grid-filter" aria-labelledby="filter-title" aria-describedby="filter-help">
  <p class="eyebrow">고객정보 필터</p><h2 id="filter-title" class="h5"></h2>
  <p id="filter-help" class="filter-help">다른 열의 조건과 함께 적용됩니다. -는 값이 없는 항목입니다.</p>
