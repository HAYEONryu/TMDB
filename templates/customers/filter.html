<dialog id="filter-dialog" class="grid-filter" aria-labelledby="filter-title" aria-describedby="filter-help">
  <header class="filter-dialog-heading"><div class="d-flex justify-content-between align-items-center gap-3"><h2 id="filter-title">상세 필터</h2><button type="button" id="filter-close" class="filter-text-button" aria-label="상세 필터 닫기">×</button></div><p id="filter-help" class="filter-help">같은 항목의 여러 값은 하나라도 일치하면 포함하고, 서로 다른 항목은 모두 만족해야 합니다.</p></header>
  <div id="filter-content"></div>
  <footer class="filter-dialog-footer"><p id="filter-summary" class="filter-help" role="status" aria-live="polite"></p><p id="filter-error" class="field-error" role="alert"></p>
    <div class="dialog-actions"><button type="button" id="filter-reset" class="filter-text-button">필터 지우기</button><button type="button" data-close class="btn btn-outline-secondary">취소</button><button type="button" id="filter-apply" class="btn btn-primary">필터 적용</button></div>
  </footer>
</dialog>
